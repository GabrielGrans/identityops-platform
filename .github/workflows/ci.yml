name: IdentityOps CI and release packaging

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: identityops_test
          POSTGRES_USER: identityops_test
          POSTGRES_PASSWORD: identityops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identityops_test -d identityops_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IDENTITYOPS_TEST_DATABASE_URL: postgresql+psycopg://identityops_test:identityops_test@localhost:5432/identityops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  package:
    if: github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: identityops-smoke-only
      SECRET_KEY: identityops-smoke-secret-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for the reverse proxy
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: |
          npm ci
          npm run build
      - name: Build and run the release stack
        run: docker compose -f infrastructure/docker/compose.release.yml up --build --wait
      - name: Smoke test
        run: |
          curl --fail --silent http://127.0.0.1:8080/
          curl --fail --silent http://127.0.0.1:8080/api/health/database | jq -e '.database == "connected"'
      - name: Package release
        run: |
          mkdir release
          docker save identityops-api:0.7.0 identityops-web:0.7.0 postgres:17 | gzip > release/identityops-images.tar.gz
          cp infrastructure/docker/compose.release.yml docs/RELEASE.md docs/IAM.md .env.example LICENSE release/
          cd release
          sha256sum identityops-images.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: identityops-0.7.0
          path: release/
      - name: Stop smoke stack
        if: always()
        run: docker compose -f infrastructure/docker/compose.release.yml down --volumes
